<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
<title>贴图</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; user-select: none; cursor: move; }
  img { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
  body::after { content: ''; position: fixed; inset: 0; border: 1px solid rgba(124,124,255,.75); pointer-events: none; }
  body:hover::after { border-color: rgba(166,107,255,.95); box-shadow: 0 0 0 1px rgba(124,124,255,.35) inset; }
  #scale { position: fixed; left: 8px; top: 8px; background: rgba(18,18,22,.85); color: #fff; font: 600 11px -apple-system, 'Segoe UI', sans-serif; padding: 3px 8px; border-radius: 6px; display: none; border: 1px solid rgba(255,255,255,.1); }
</style>
</head>
<body>
<img id="img" alt="">
<div id="scale"></div>
<script src="../i18n.js"></script>
<script src="pin.js"></script>
</body>
</html>
