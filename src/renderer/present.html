<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BillyShot Present</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; pointer-events: none; user-select: none; }
  #halo, .rip, #spot, #dimAll { position: fixed; left: 0; top: 0; pointer-events: none; will-change: transform; }
  #halo { border-radius: 50%; display: none; }
  /* Fallback when rippleStyle is single or WebGL is unavailable: 3 concentric translucent white rings, not pink. */
  .rip { width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; box-sizing: border-box;
    border: 2px solid rgba(255,255,255,.78);
    box-shadow: 0 0 0 10px rgba(255,255,255,.34), 0 0 0 22px rgba(255,255,255,.16);
    background: transparent;
    animation: rip .7s cubic-bezier(.2,.7,.3,1) forwards; }
  /* 水波纹（1.3.3）：WebGL 按水面起伏算高光和阴影 */
  #water { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  @keyframes rip { from { transform: scale(.25); opacity: 1; } to { transform: scale(1); opacity: 0; } }
  #spot { transform-origin: 0 0; display: none; }
  #dimAll { width: 100%; height: 100%; display: none; }
</style>
</head>
<body>
<div id="dimAll"></div>
<div id="spot"></div>
<canvas id="water"></canvas>
<div id="halo"></div>
<script src="present-layer.js"></script>
</body>
</html>
