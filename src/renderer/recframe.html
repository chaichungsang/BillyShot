<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Hopsnap RecFrame</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' file: data:; style-src 'self' 'unsafe-inline'">
<style>
  @font-face { font-family: "Nunito"; src: url("../../assets/fonts/Nunito.ttf") format("truetype"); font-weight: 200 1000; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #border { position: fixed; inset: 1px; border: 2px dashed rgba(255,90,110,.95); border-radius: 6px; }
  body.rec #border { border-style: solid; border-color: rgba(255,90,110,.95); }
  body.full #border { display: none; }
  body.full.counting #border { display: block; }
  /* 倒计时：小青蛙鼓着腮帮子憋气，数字在它肚子上 */
  #count { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -54%); width: 168px; height: 168px; display: none; }
  #count svg { position: absolute; left: 0; top: 0; width: 168px; height: 168px; }
  #count b { position: absolute; left: 0; right: 0; top: 106px; text-align: center; color: #163B2A;
    font: 800 42px/1 "Nunito", "Segoe UI Variable Display", "SF Pro Display", -apple-system, "Segoe UI", sans-serif; }
  body.counting #count { display: block; }
  #tip { position: fixed; left: 50%; top: calc(50% + 92px); transform: translateX(-50%); color: #ECF2EE; background: rgba(24,28,26,.88);
    font: 600 12px "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 5px 13px; border-radius: 999px; white-space: nowrap; display: none; border: 1px solid rgba(255,255,255,.1); }
  body.counting #tip { display: block; }
</style>
</head>
<body>
<div id="border"></div>
<div id="count"><span id="frog"></span><b id="num"></b></div>
<div id="tip">即将开始录制…</div>
<script src="frog.js"></script>
<script src="../i18n.js"></script>
<script src="recframe.js"></script>
</body>
</html>
